# Local development database.
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gpstracker
      POSTGRES_PASSWORD: gpstracker
      POSTGRES_DB: gpstracker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
